# First-install defaults. Existing files are preserved by the pack index.
_version = 5

[client.advanced.graphics]
enableSsao = false
enableAntiAliasing = true

[client.advanced.graphics.quality]
lodChunkRenderDistanceRadius = 64
maxHorizontalResolution = "BLOCK"
horizontalQuality = "LOW"
verticalQuality = "LOW"
transparency = "DISABLED"
vanillaFadeMode = "SINGLE_PASS"
ditherDhFade = true
lodBiomeBlending = 1

[client.advanced.graphics.culling]
enableCaveCulling = true

[client.advanced.graphics.experimental]
ignoredDimensionCsv = "shallows_crossing:shallows"

[common.multiThreading]
numberOfThreads = 1
threadRunTimeRatio = 0.5

[common.worldGenerator]
generatorPlan = "CHUNKS_ONLY"
chunkGeneratorMode = "PRE_EXISTING_ONLY"

[server]
maxGenerationRequestDistance = 256
realTimeUpdateDistanceRadiusInChunks = 64
maxSyncOnLoadRequestDistance = 256
playerBandwidthLimit = 250
globalBandwidthLimit = 1000
